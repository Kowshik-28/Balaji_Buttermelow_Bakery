services:
  - type: web
    name: buttermelow
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /data/treats_by_mimi.db
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_EMAIL_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false
    disk:
      name: buttermelow-data
      mountPath: /data
      sizeGB: 1
