<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Login | Buttermelow</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>

<body class="login-body">
  <form class="login-panel" method="post">
    <img src="/static/logo.jpg" alt="Buttermelow">
    <p class="eyebrow">Private workspace</p>
    <h1>Owner login</h1>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="button primary wide" type="submit">Sign in</button>
    <a class="text-link" href="/">Return to website</a>
  </form>
</body>

</html>
